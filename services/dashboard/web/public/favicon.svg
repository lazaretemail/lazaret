<!--
  The mark on its own ink tile. A bare mark would use ink squares that vanish against
  a dark browser tab and paper squares that vanish against a light one; carrying its
  own ground means it reads either way.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <rect width="100" height="100" rx="18" fill="#131417"/>
  <rect x="14" y="14" width="30" height="30" fill="#F4F2ED"/>
  <rect x="56" y="14" width="30" height="30" fill="#F4F2ED"/>
  <rect x="14" y="56" width="30" height="30" fill="#F4F2ED"/>
  <path d="M71 54 L88 71 L71 88 L54 71 Z" fill="#F0A32A"/>
</svg>
