# SPDX-License-Identifier: AGPL-3.0-only
#
# The console's TypeScript types are generated from the Go structs the dashboard
# actually serialises, so the two cannot drift. Regenerate with `go generate ./...`
# from services/dashboard after changing any wire type in client.go or api.go.
packages:
  - path: "github.com/lazaretemail/lazaret/services/dashboard"
    output_path: "web/src/api/types.gen.ts"
    include_files: ["client.go", "api.go", "auth.go"]
    frontmatter: |
      // SPDX-License-Identifier: AGPL-3.0-only
      //
      // Code generated by tygo from the Go wire types. DO NOT EDIT.
    type_mappings:
      time.Time: "string"
      json.RawMessage: "unknown"
      "json.Number": "number"
