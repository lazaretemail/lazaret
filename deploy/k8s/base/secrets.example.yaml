#
# A template. Do not apply this file, and do not commit the one you make from it.
#
# Three secrets rather than one, so that no pod is handed a credential it has no use
# for. envFrom on a single blob would give the engine the ingest connector's API token
# and the dashboard the database password, and "it is only in the environment" is not
# an argument that survives a container escape.
#
#   kubectl -n lazaret create secret generic lazaret-postgres \
#     --from-literal=POSTGRES_PASSWORD="$PG"
#
#   kubectl -n lazaret create secret generic lazaret-engine \
#     --from-literal=LAZARET_POSTGRES="postgres://lazaret:$PG@postgres:5432/lazaret?sslmode=disable" \
#     --from-literal=LAZARET_SECRET_KEY="$(openssl rand -hex 32)" \
#     --from-literal=LAZARET_ADMIN_EMAIL=admin@example.com \
#     --from-literal=LAZARET_ADMIN_PASSWORD="$(openssl rand -base64 24)" \
#     --from-literal=LAZARET_S3_KEY=... --from-literal=LAZARET_S3_SECRET=...
#
#   kubectl -n lazaret create secret generic lazaret-ingest \
#     --from-literal=LAZARET_SERVICE_TOKEN=...
#
# LAZARET_SECRET_KEY encrypts mailbox credentials at rest and must be 64 hex
# characters. Losing or changing it does not lose the mailboxes, but every stored
# credential becomes undecryptable and has to be re-entered — so it is not something
# to rotate casually, and it belongs in whatever holds your other long-lived keys.
---
apiVersion: v1
kind: Secret
metadata:
  name: lazaret-postgres
  namespace: lazaret
type: Opaque
stringData:
  POSTGRES_PASSWORD: "replace-me"
---
# Garage's own cluster secrets, unrelated to the S3 credentials the engine uses.
#
#   kubectl -n lazaret create secret generic lazaret-garage \
#     --from-literal=GARAGE_RPC_SECRET="$(openssl rand -hex 32)" \
#     --from-literal=GARAGE_ADMIN_TOKEN="$(openssl rand -base64 32)"
apiVersion: v1
kind: Secret
metadata:
  name: lazaret-garage
  namespace: lazaret
type: Opaque
stringData:
  GARAGE_RPC_SECRET: "replace-me-with-64-hex-characters"
  GARAGE_ADMIN_TOKEN: "replace-me"
---
apiVersion: v1
kind: Secret
metadata:
  name: lazaret-engine
  namespace: lazaret
type: Opaque
stringData:
  # Must carry the same password as the secret above. One string rather than parts,
  # because a DSN cannot be assembled from environment variables without a shell, and
  # the engine image has none.
  LAZARET_POSTGRES: "postgres://lazaret:replace-me@postgres:5432/lazaret?sslmode=disable"
  LAZARET_SECRET_KEY: "replace-me-with-64-hex-characters-openssl-rand-hex-32"
  LAZARET_ADMIN_EMAIL: "admin@example.com"
  LAZARET_ADMIN_PASSWORD: "replace-me-at-least-twelve-characters"
  LAZARET_S3_KEY: "replace-me"
  LAZARET_S3_SECRET: "replace-me"
---
apiVersion: v1
kind: Secret
metadata:
  name: lazaret-ingest
  namespace: lazaret
type: Opaque
stringData:
  # An engine API token with the admin role. Create it after the engine is up:
  # sign in, Settings → Users & tokens.
  #
  # An API token specifically, not a user's session: mailbox credentials and the
  # remediation queue are readable only by a token, and a signed-in browser session is
  # refused at those endpoints however privileged it is. That is what stops an XSS in
  # the dashboard reaching a mailbox password.
  LAZARET_SERVICE_TOKEN: ""

  # Microsoft 365, when a mailbox of kind "graph" is configured. The application
  # registration is a property of this deployment rather than of any one mailbox.
  LAZARET_GRAPH_TENANT: ""
  LAZARET_GRAPH_CLIENT: ""
  # The secret Graph echoes back in every notification, and the only thing that
  # distinguishes a real one from anyone on the internet who has found the endpoint.
  LAZARET_GRAPH_CLIENT_STATE: ""

  # The shared secret the Rspamd Lua plugin sends. Required if the inline path is
  # enabled: without it, anyone who can reach the port can submit mail for scoring,
  # which both leaks what the rules do and lets an attacker probe until something
  # scores clean.
  LAZARET_RSPAMD_SECRET: ""
