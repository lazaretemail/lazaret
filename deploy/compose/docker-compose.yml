# SPDX-License-Identifier: AGPL-3.0-only
#
# The Lazaret stack, whole.
#
#   cp .env.example .env     # set a Postgres password and the first admin account
#   docker compose up -d
#
# That is the deployment. Everything is here — the engine, the dashboard, mail
# ingestion, the classifier, file analysis, the renderer with link analysis — and
# everything after this is done by an administrator in the browser: mailboxes, their
# credentials, the Microsoft application registration, lists, users.
#
# Nothing here needs a secret prepared in advance. The key that encrypts mailbox
# credentials and the token the mail connector authenticates with are generated by
# the engine on first start into the `state` volume, because neither could come from
# the web interface — the services that need them cannot start without them. Back
# that volume up: losing the key means every mailbox credential has to be entered
# again. See services/engine/bootstrap.go for the tradeoff that makes.
#
# Storage decisions are recorded in docs/ADR-001-storage.md.

name: lazaret

# Strelka comes up with everything else.
#
# It used to be a separate compose project, which put it on its own networks: the
# engine could not resolve the frontend, so file.explode, beta.ocr, beta.scan_qr and
# beta.parse_exif were unavailable on every message, and the engine cheerfully
# reported "strelka" among its providers because attaching a client only means it was
# handed an address. Including it here makes one project, one set of networks, and one
# command.
include:
  - ../../third_party/strelka/docker-compose.yml

# Telemetry, shared by every service.
#
# Off unless LAZARET_OTLP_ENDPOINT is set, because exporters retrying against a
# collector that does not exist turn a working install into a stream of connection
# errors. Point it at your collector to turn tracing, metrics and logs on:
#
#   LAZARET_OTLP_ENDPOINT=http://host.docker.internal:4318
#
# The variables below are OpenTelemetry's own, so anyone who knows OTel already
# knows how to retune this — sampling, headers, protocol and the rest work as
# documented without this file inventing names for them.
x-hostgw: &hostgw
  - "host.docker.internal:host-gateway"

x-telemetry: &telemetry
  OTEL_EXPORTER_OTLP_ENDPOINT: "${LAZARET_OTLP_ENDPOINT:-}"
  OTEL_EXPORTER_OTLP_PROTOCOL: "${LAZARET_OTLP_PROTOCOL:-http/protobuf}"
  OTEL_EXPORTER_OTLP_HEADERS: "${LAZARET_OTLP_HEADERS:-}"
  OTEL_TRACES_SAMPLER: "${LAZARET_OTLP_SAMPLER:-parentbased_always_on}"
  OTEL_RESOURCE_ATTRIBUTES: "deployment.environment=${LAZARET_ENV:-production}"

services:
  # The API and pipeline. Module 2: everything that needs state.
  engine:
    build:
      context: ../..
      dockerfile: services/engine/Dockerfile
    command:
      - "-addr=:8700"
      - "-rules=/etc/lazaret/rules"
      # Storage is configured in the environment below, not here.
      #
      # Compose replaces `command` wholesale rather than merging it, so anything an
      # overlay might want to change has to live in `environment`, which does
      # merge. An overlay that restates `command` silently drops every flag this
      # file gains afterwards — which is exactly what happened to -public-url.
      # Where the original bytes of every ingested message are held. Quarantine
      # removes a message from the mailbox rather than filing it, so this is the only
      # remaining copy and the thing that makes releasing possible.
      #
      # Its own prefix in the blob store, never the corpus prefix: DuckLake rewrites
      # and expires what it owns during compaction, and a compaction must not be able
      # to remove mail under legal hold.
      # Encrypts mailbox credentials at rest. Left empty here on purpose: the
      # engine generates one into the state volume on first start, so a fresh
      # deployment needs no secret prepared by hand. Set LAZARET_SECRET_KEY to
      # supply your own — from a secret manager, say — and this never generates.
      - "-secret-key=${LAZARET_SECRET_KEY:-}"
      - "-state=/var/lib/lazaret/state"
      # Where this deployment is reachable from the internet, if it is. Anything
      # needing a public callback derives its own from this — currently the
      # Microsoft 365 notification endpoint, which is why nobody has to paste a
      # callback URL into a form. Empty means Microsoft is polled instead, which
      # needs no inbound path at all.
      - "-public-url=${LAZARET_PUBLIC_URL:-}"
      - "-admin-email=${ADMIN_EMAIL:-admin@example.com}"
      - "-admin-password=${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env: this is the first administrator's password and there is no safe default}"
    extra_hosts: *hostgw
    environment:
      <<: *telemetry
      LAZARET_POSTGRES: "postgres://lazaret:${POSTGRES_PASSWORD:-lazaret}@postgres:5432/lazaret?sslmode=disable"

      # Storage: the blob store below, bootstrapped by garage-init before this
      # service starts. There is no second compose file to remember — a stack that
      # needed one had a failure mode where `docker compose up -d engine` without
      # it silently repointed the corpus at a local path, which DuckLake refuses
      # because the path does not match its catalog, and the engine crash-looped.
      #
      # To use somewhere else's S3 instead, set these five and drop the garage and
      # garage-init services; nothing in the engine knows the difference.
      LAZARET_DATA: "s3://lazaret-corpus/"
      LAZARET_RAW: "s3://lazaret-custody/messages"
      LAZARET_S3_ENDPOINT: "garage:3900"
      # Garage's default region. SigV4 signs the region into the request, so a
      # wrong one comes back as AuthorizationHeaderMalformed, which reads like a
      # credentials problem and is not one.
      LAZARET_S3_REGION: "garage"
      # From a file on a shared volume, not from the environment: garage-init
      # generated them and wrote them there, so no credential passes through
      # `docker inspect`, /proc, or an operator copying output into .env. Set
      # S3_ACCESS_KEY and S3_SECRET_KEY in .env to supply your own instead —
      # garage-init will import them and these files will hold what you chose.
      LAZARET_S3_KEY_FILE: "/var/lib/lazaret/blobcreds/access_key"
      LAZARET_S3_SECRET_FILE: "/var/lib/lazaret/blobcreds/secret_key"

      # Visiting links is on. It is the difference between 130 rules running and
      # reporting indeterminate, and it is why `render` sits on the edge network
      # below — read the note there before deciding to keep it.
      LAZARET_RULE_CONCURRENCY: "${LAZARET_RULE_CONCURRENCY:-}"
      LAZARET_LINK_ANALYSIS: "${LAZARET_LINK_ANALYSIS:-on}"

      # Every enrichment this stack can answer, wired. Leaving one out does not break
      # anything — the rules that need it report indeterminate — but it does quietly
      # remove a large part of the rule set, which is the opposite of a useful default.
      #
      #   strelka  file.explode, beta.ocr, beta.scan_qr, beta.parse_exif   (~440 rules)
      #   render   file.message_screenshot, file.html_screenshot           (~110 rules)
      #   ml       ml.nlu_classifier, ml.logo_detect and the rest          (~600 rules)
      #
      # network.whois needs no service and is on by default.
      LAZARET_RENDER: "http://render:8710"
      LAZARET_ML: "http://ml:8720"
      # The network alias the Strelka frontend answers to, set where it is included
      # above. Override STRELKA_ADDR to point at one running elsewhere.
      LAZARET_STRELKA: "${STRELKA_ADDR:-strelka:57314}"

    volumes:
      # Our own detection content, tracked in this repository. Everything else —
      # the Sublime corpus and any feed an operator adds — is cloned into the state
      # volume by the engine, so a fresh clone of this repo is a working install
      # rather than one with an empty rules directory.
      - ../../content/rules:/etc/lazaret/rules:ro
      # Generated on first start: the credential encryption key and the mail
      # connector's API token. Shared with `ingest`, which reads the token from
      # here rather than from an environment variable — so it appears in neither
      # `docker inspect` nor the process table.
      #
      # This is the volume to back up. The database can be rebuilt from mail; the
      # key cannot be rebuilt from anything.
      - state:/var/lib/lazaret/state
      # The blob store credential garage-init created. Read-only: this service
      # uses the key, it does not get to change it.
      - blobcreds:/var/lib/lazaret/blobcreds:ro
    ports:
      - "127.0.0.1:8700:8700"
    depends_on:
      postgres: {condition: service_healthy}
      # Not service_started. The buckets and the key have to exist before the
      # first write, and "started" would race them.
      garage-init: {condition: service_completed_successfully}
    networks: [edge, analysis]
    deploy:
      resources:
        # A ceiling, not a target. Measured working set is about 1.8GB — the 1,258
        # compiled rules, the $list data, the enricher caches and DuckDB's buffer
        # pool — and a burst of eight concurrent analyses took it to 1.9GB. Eight
        # gives that room to grow into and a hunt room to work in.
        #
        # The point of setting it at all is that DuckDB is linked into this
        # process and sizes itself from what it can see. Uncapped, its default
        # memory_limit is 80% of *system* RAM: on a 32GB host this one service
        # would decide it may use 24GB while sharing the machine with twelve other
        # containers. The engine reads this limit and gives DuckDB a third of it,
        # with a spill directory on the state volume so a large hunt gets slower
        # rather than refused. Raise both together.
        limits: {memory: 8G}
    restart: unless-stopped

  # Object storage for the corpus and for custody.
  #
  # Garage: AGPL-3.0, alive, and not MinIO, which gutted its community edition in
  # 2025 and was archived in February 2026. See docs/ADR-001-storage.md.
  #
  # Single node here, which is what one server needs. A real multi-node deployment
  # raises replication_factor in garage.toml and gives each node a zone — and
  # should also replace the rpc_secret in that file, which only guards node-to-node
  # RPC and is therefore inert while there is one node on an internal network.
  garage:
    image: dxflrs/garage:v1.0.1
    volumes:
      - ./garage.toml:/etc/garage.toml:ro
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data
    networks: [analysis]
    restart: unless-stopped

  # One-shot: cluster layout, buckets, access key, permissions.
  #
  # A fresh Garage has none of those, and until it does every write is a 403 or a
  # 503 — on a deployment where nobody has done anything wrong. This used to be
  # eight commands in a comment ending with "paste the key into .env and start
  # again". It is now a script, it is idempotent, and it runs before the engine.
  #
  # It shares garage's network namespace and its metadata volume because that is
  # what the CLI needs to talk to the local node: the node identity lives in the
  # metadata directory and the RPC address in the config is a loopback one.
  garage-init:
    build:
      context: ./garage-init
    network_mode: "service:garage"
    volumes:
      - ./garage.toml:/etc/garage.toml:ro
      - garage-meta:/var/lib/garage/meta
      - blobcreds:/var/lib/lazaret/blobcreds
    environment:
      # Optional. Empty means "generate a credential and keep it on the volume",
      # which is the whole point — nothing to prepare before the first deploy.
      S3_ACCESS_KEY: "${S3_ACCESS_KEY:-}"
      S3_SECRET_KEY: "${S3_SECRET_KEY:-}"
    depends_on:
      garage: {condition: service_started}
    restart: on-failure

  # Triage, hunt, rules and insights. Module 7.
  #
  # Authenticates against the engine: local passwords, or OIDC when the oidc-* flags
  # are set. Sessions are the engine's, so the dashboard holds no user database of its
  # own. Still worth putting behind whatever you already run at the edge for TLS.
  dashboard:
    build:
      context: ../..
      dockerfile: services/dashboard/Dockerfile
    command: ["-addr=:8740"]
    extra_hosts: *hostgw
    environment:
      <<: *telemetry
      LAZARET_ENGINE: "http://engine:8700"
    ports:
      - "127.0.0.1:8740:8740"
    depends_on: [engine]
    networks: [edge, analysis]
    restart: unless-stopped

  # Where mail comes from, and what is done about it. Module 6.
  #
  # Mail ingestion. Module 6.
  #
  # Managed: the mailboxes come from the engine, added by an administrator on the
  # dashboard's Mailboxes page, so a new inbox is not a redeploy and no mail
  # credential is ever written in this file. The connector reads its own API token
  # from the state volume, which the engine provisions on first start.
  #
  # It does nothing at all until a mailbox is configured, which is what makes it
  # reasonable to have running on a stack somebody is only evaluating.
  ingest:
    build:
      context: ../..
      dockerfile: services/ingest/Dockerfile
    command:
      - "-managed"
      - "-service-token-file=/var/lib/lazaret/state/connector-token"
      # Inline scanning before delivery is off by default, and deliberately not
      # wired to an empty secret. The connector refuses to open that listener
      # without one — an unauthenticated endpoint that accepts mail for scanning
      # is a way into the pipeline — so enabling it is two flags and a secret,
      # not a blank environment variable:
      #
      #   - "-rspamd-addr=:8730"
      #   - "-rspamd-secret=${RSPAMD_SECRET}"
      #
      # See services/ingest/lua/ for the plugin that talks to it.
      # Microsoft 365 needs nothing here. The application registration is a
      # property of the deployment rather than of any one mailbox, so it is set on
      # the dashboard under Settings → Microsoft 365 and read from the engine on
      # the same tick as the mailbox list — including after a client secret is
      # rotated, which is a form submission rather than a redeploy.
    extra_hosts: *hostgw
    environment:
      <<: *telemetry
      LAZARET_ENGINE: "http://engine:8700"
    volumes:
      # Read-only: the connector consumes the token and has no business writing
      # to the directory that holds the credential key.
      - state:/var/lib/lazaret/state:ro
    # The engine's group, so this process can read the token file — which is 0640
    # and group-owned by the engine. The credential key next to it is 0600, so
    # membership of this group grants the token and nothing else: the connector
    # can list mailboxes and cannot decrypt what is stored about them.
    group_add: ["10002"]
    ports:
      # Graph notifications, for a Microsoft 365 deployment that puts a TLS proxy
      # in front. Polling works without it and is the default.
      - "127.0.0.1:8731:8731"
    depends_on:
      engine: {condition: service_started}
    # edge only. This process holds every mailbox credential in the tenant and
    # talks to mail providers on the internet; it has no business reaching the
    # renderer or the file scanners.
    networks: [edge]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs:
      - /tmp:size=64m
    restart: unless-stopped
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: lazaret
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-lazaret}"
      POSTGRES_DB: lazaret
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lazaret"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [analysis]
    restart: unless-stopped

  # Object storage: Garage, AGPL-3.0, from the Deuxfleurs collective. Holds the Parquet
  # corpus and the raw message bytes. Not MinIO — archived February 2026.
  garnet:
    image: ghcr.io/microsoft/garnet:latest
    command: ["--port", "6379", "--bind", "0.0.0.0"]
    ulimits:
      memlock: -1
    networks: [analysis]
    restart: unless-stopped

  # Headless rendering. Module 4.
  render:
    build:
      # From the repository root, like every other service here. The Dockerfile
      # copies go.mod from the root as well as from services/render — the module
      # graph spans both — so a context of services/render alone cannot build it.
      context: ../..
      dockerfile: services/render/Dockerfile
    # A taller viewport than the 1400px default. Chromium screenshots the viewport
    # rather than the content, so anything below the fold is simply not in the
    # picture — and these are shown to analysts as "what the recipient saw". The
    # blank page below a short message is trimmed off by the engine, so the extra
    # height costs nothing when it is not needed.
    #
    # -fetch is what link analysis needs: it lets this service visit the links in a
    # message. See the note on the networks below for what that changes.
    command: ["-addr", ":8710", "-height", "2400", "-fetch"]
    extra_hosts: *hostgw
    environment:
      <<: *telemetry
      # Share fetched link results across processes and restarts.
      #
      # This service keeps a fifteen-minute cache in its own memory, which removes the
      # duplicate work inside one campaign's burst and nothing else: restart it and the
      # cache is empty, and a URL seen on Monday is fetched again on Tuesday. Link
      # analysis is around thirty-eight fetches a message and the dominant cost of an
      # analysis, so those repeats are worth removing.
      #
      # Garnet was already deployed for exactly this kind of thing and nothing was
      # using it. It fails soft — a Garnet that is down makes analysis slower and never
      # makes it wrong, and backs off rather than dialling on every link — so there is
      # no reason to leave it off.
      LAZARET_LINK_STORE: "garnet:6379"

      # What a link visit presents as.
      #
      # A phishing kit serves a benign page to anything that looks like a scanner, so
      # what the browser says it is decides whether the answer is the one the
      # recipient got. Both halves of a visit — the HTTP client and the browser —
      # derive everything from these two settings, so they cannot disagree.
      #
      # The language is a real preference, not a disguise: a deployment protecting
      # Spanish-speaking recipients should ask for Spanish and be served the page
      # those recipients saw. Quality values are added automatically; write the bare
      # list, e.g. "es-ES,es,en".
      LAZARET_ACCEPT_LANGUAGE: "${LAZARET_ACCEPT_LANGUAGE:-en-US,en}"
      # linux | windows | macos. Everything that has to agree — the user agent token,
      # Sec-CH-UA-Platform and the Client Hints metadata — comes from this one name,
      # because a browser claiming one platform in one header and another elsewhere
      # is precisely what a cloaking check looks for.
      #
      # Worth considering "windows" if the recipients are a typical corporate
      # population: the point is to look like them, and most of them are on Windows.
      LAZARET_BROWSER_PLATFORM: "${LAZARET_BROWSER_PLATFORM:-linux}"
      # Visit links with obscura instead of starting a second Chromium.
      #
      # The link path asks a browser for outerHTML after script has run, and nothing
      # else: inner_text, display_text and links are derived from that string in Go.
      # No layout is read and no pixels are painted, so this job does not need the
      # engine that screenshots do — and it does not need its ~375MB either.
      #
      # Screenshots stay on the local Chromium. That is not a preference: a renderer
      # that lays out wrongly still emits a valid PNG, so OCR reads nothing and every
      # rule downstream reports "found nothing" rather than "could not look".
      # Links are visited by the local Chromium, not by the lightweight engine.
      #
      # That is a reversal, and the reason is cloaking. A phishing kit serves a benign
      # page to anything that looks like a scanner and the credential form to everyone
      # else, so what the browser says it is decides whether the answer is the real
      # one. Chromium can be told to present as an ordinary Chrome; lightpanda cannot
      # — a user agent containing "Mozilla" is a fatal startup error, and it answers
      # OK to Network.setUserAgentOverride and then ignores it, still sending
      # Sec-Ch-Ua: "Lightpanda". It is permanently identifiable by design.
      #
      # It was 1.8x faster and 60x lighter, and none of that is worth a systematic
      # false negative on exactly the pages worth looking at.
      #
      # To use it anyway — a deployment where cloaking is not the concern, or one that
      # cares more about memory than about cloaked pages:
      # LAZARET_LINK_BROWSER: "http://lightpanda:9222"
    shm_size: 512mb
    # analysis to be reachable by the engine; edge because link analysis means
    # visiting links, which is an outbound connection to an address an attacker
    # chose; linkbrowser to reach obscura's CDP port, which is deliberately not on
    # a network anything else shares. See the note under networks below.
    networks: [analysis, edge, linkbrowser]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs:
      - /tmp:size=512m
      - /home/render:size=64m
    deploy:
      resources:
        # Four, not two. Each link in a message is a browser, and browsers are CPU
        # work: nine concurrent fetches against two cores took ten seconds each,
        # where one alone takes under a second. The engine will not run more of
        # these at once than there are cores here — see prefetchConcurrency — so
        # this number and that one move together.
        limits: {cpus: "4.0", memory: 2G}
    restart: unless-stopped

  # Model inference. Module 5. Reports every capability unavailable until weights are
  # mounted, which is the intended state of a fresh deployment rather than a fault.
  ml:
    build:
      context: ../..
      dockerfile: services/ml/Dockerfile
      args:
        # The build with an inference runtime. Without it ml.nlu_classifier answers
        # entities and language only, and the 358 rules that read .intents report
        # indeterminate. "none" for a deployment that has no weights and does not
        # want a 200MB native dependency.
        TAGS: onnx
    command: ["-addr", ":8720", "-models", "/var/lib/lazaret/models"]
    volumes:
      - ./models:/var/lib/lazaret/models:ro
    # `edge` as well as `analysis`, so this service can reach a telemetry collector.
    #
    # The models here are fixed-graph ONNX classifiers — zero-shot entailment, logo
    # matching, OCR, QR — with no tool use and no way to act on what they read. A
    # message that says "fetch this URL" is, to them, just text to be scored. The
    # egress concern that keeps other things off this network does not apply.
    networks: [analysis, edge]
    extra_hosts: *hostgw
    environment:
      <<: *telemetry
    restart: unless-stopped

  # The browser that visits links.
  #
  # Not the browser that screenshots messages, and it could not be: it does not paint
  # at all. That is the point — the link path asks for the document after script has
  # run and derives inner_text, display_text and links from that string in Go, so no
  # layout is read and no pixels are painted. Screenshots stay on the Chromium in
  # lazaret-render, where a renderer that lays out wrongly would still emit a valid
  # PNG and have OCR report "found nothing" rather than "could not look".
  #
  # Measured over ten links from one real marketing email, run back to back:
  #
  #   local Chromium    11.9s   203MiB
  #   lightpanda         8.9s   3.7MiB
  #
  # Faster and about fifty times lighter, and six of the ten produced byte-identical
  # extracted links and text, with trivial variance on two more. See the caveat in
  # docs/ARCHITECTURE.md about heavy single-page applications.
  lightpanda:
    # Not started by default: see the note on LAZARET_LINK_BROWSER above. Bring it up
    # deliberately with `docker compose --profile linkbrowser up -d`.
    profiles: ["linkbrowser"]
    build:
      context: lightpanda
      dockerfile: Dockerfile
    # Its CDP port carries no authentication and is a remote control for a browser, so
    # it is on a network with exactly one other member rather than on `analysis`.
    networks: [linkbrowser, edge]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs:
      - /tmp:size=128m
      - /home/lightpanda:size=32m
    # It executes attacker-chosen JavaScript. Bounded so a page that allocates in a
    # loop kills the browser rather than the host; the renderer treats an unreachable
    # link browser as "report the served HTML", so a restart degrades link analysis
    # for a moment rather than failing it.
    mem_limit: 512m
    restart: unless-stopped

networks:
  # Reachable from the host.
  edge: {}

  # Just the renderer and the link browser. A CDP endpoint is an open invitation to
  # whatever can reach it, so it gets the smallest network that works rather than
  # sharing `analysis` with the engine, the dashboard and the connectors.
  linkbrowser:
    internal: true

  # No egress. The renderer has just executed hostile HTML and the engine has just
  # parsed a hostile message; neither should be able to reach the internet, and
  # analysing a message must not tell its sender it was read.
  #
  # The renderer is the exception, and it is a deliberate one. Link analysis means
  # visiting the links in a message, which requires exactly the egress this network
  # exists to deny — so `render` joins `edge` as well, and what you get is 130 rules
  # that can run instead of reporting indeterminate.
  #
  # What you accept: a browser fetching attacker-chosen URLs from your address space,
  # and senders who can tell their mail was opened. The renderer's own SSRF guards
  # still apply — it re-resolves the host on dial and refuses private ranges — and
  # message screenshots resolve no hostnames at all, so a tracking pixel in a message
  # body still cannot fire. To turn it off: drop `-fetch` and `-link-analysis`, and
  # take `edge` off the renderer.
  analysis:
    internal: true

volumes:
  postgres-data:
  garage-meta:
  garage-data:
  # The blob store credential garage-init creates on first start, and the engine
  # reads. Tiny, and losing it is recoverable — garage-init makes a new key and
  # grants it the same buckets.
  blobcreds:
  # The credential key and the connector token, generated on first start. Small,
  # and the one volume whose loss cannot be recovered from elsewhere.
  state:
