name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: true

      - name: Workspace is consistent
        run: |
          go work sync
          git diff --exit-code go.work go.mod || {
            echo "::error::go.work or go.mod changed; commit the result of 'go work sync'"
            exit 1
          }

      - name: Formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt needed for:"; echo "$unformatted"; exit 1
          fi

      - name: Generated code is current
        run: |
          go generate ./...
          git diff --exit-code || {
            echo "::error::generated files are stale; run 'go generate ./...' and commit"
            exit 1
          }

      - run: go vet ./...
      - run: go build ./...

      # The Office fixtures are generated, not committed, and the tests that read them
      # fail rather than skip when they are absent — so this has to run before the
      # tests, not alongside them.
      #
      # Generated because they are malicious-document shaped: a macro-bearing .docm and
      # a CVE-2021-40444 reproduction are exactly what a scanner flags, and a public
      # repository carrying them invites trouble it does not need. A generator is also
      # a fixture somebody dares to change, which a checked-in blob is not.
      #
      # olefile is a real dependency, not a convenience: the Go reader is a
      # reimplementation of the compound-file format, so the generator verifies every
      # file it writes against the reference implementation. Testing a reimplementation
      # against fixtures built by the same understanding would only prove the two agree
      # with each other.
      - name: Build the Office fixtures
        run: |
          python3 -m pip install --quiet --break-system-packages olefile
          python3 oletools/testdata/generate.py

      - run: go test -race ./...

      # The compatibility claim is only worth making if CI measures it. The corpus is
      # fetched rather than vendored: pinning a copy would turn a claim about the live
      # rule ecosystem into a claim about a snapshot.
      - name: Fetch the public rule corpus
        run: git clone --depth 1 https://github.com/sublime-security/sublime-rules testdata/sublime-rules

      - name: Corpus compatibility
        env:
          LAZARET_CORPUS: testdata/sublime-rules
        run: go test ./mql/ -run 'TestLexCorpus|TestParseCorpus|TestCheckCorpus|TestEvalCorpus' -v

      # The core library must stay importable on its own, so what it actually links is
      # budgeted. This counts packages the default build really imports, not the module
      # graph: yara-x and protobuf appear in go.mod for the -tags yara build but are not
      # linked without it, and counting them would penalise an optional capability.
      - name: Core dependency budget
        run: |
          modules=$(GOWORK=off go list -deps ./mdm/ ./eml/ ./mql/ ./rules/ ./lists/ \
            | grep -E '^[a-z0-9-]+\.[a-z]+/' \
            | grep -v '^github.com/lazaretemail/lazaret' \
            | sed -E 's|^([^/]+/[^/]+/?[^/]*).*|\1|' | sort -u)
          count=$(echo "$modules" | grep -c . || true)
          echo "linked by the core: $count"
          echo "$modules"
          if [ "$count" -gt 12 ]; then
            echo "::error::the core links $count third-party modules (budget 12)"; exit 1
          fi

  yara:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: true

      # YARA-X is a Rust library reached through cgo, so the tagged build needs its C
      # API present. The core stays cgo-free precisely so that this is one job's
      # problem rather than every contributor's.
      #
      # Three things were wrong here and each hid the next.
      #
      # The install wrote straight to /usr/local, which the runner's user cannot create
      # directories in: "failed to create directory /usr/local/lib/x86_64-linux-gnu —
      # Permission denied". It is now built as the user, staged into a destdir and
      # copied in with sudo, which is the ordinary way round — running cargo as root
      # would rebuild every crate into root's registry.
      #
      # `A || B && C` binds as `(A || B) && C`, so the second cinstall ran whether or
      # not the first had succeeded, and a genuine failure was indistinguishable from
      # cargo-c simply not being installed yet. It is installed up front, once.
      #
      # yara-x-cli was installed and never used: nothing here shells out to `yr`, the
      # binding links the C API. It cost several minutes a run to build a binary no
      # test invokes.
      - name: Build YARA-X
        run: |
          set -eux
          cargo install --locked cargo-c
          git clone --depth 1 --branch v1.20.0 https://github.com/VirusTotal/yara-x /tmp/yara-x
          cargo cinstall --release \
            --prefix /usr/local --destdir /tmp/yara-x-staged \
            --manifest-path /tmp/yara-x/capi/Cargo.toml
          sudo cp -a /tmp/yara-x-staged/usr/local/. /usr/local/
          sudo ldconfig
          # Fail here, where the message can say what is missing, rather than at link
          # time where it says "cannot find -lyara_x_capi".
          pkg-config --exists yara_x_capi \
            || { echo "::error::yara_x_capi.pc was not installed"; exit 1; }

      - run: go build -tags yara ./...
      - run: go test -tags yara ./yara/...

  # The unit tests cannot find a wire-format mismatch, because a fixture written from the
  # published schema and a fake built from the same schema agree with each other. Both
  # divergences in Strelka's response were found by running the real thing, and one of
  # them survived a live scan until a YARA signature actually matched. So the deployment
  # itself is part of CI.
  strelka:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: true

      - name: Start Strelka
        run: docker compose -f third_party/strelka/docker-compose.yml up -d

      - name: Fetch the public rule corpus
        run: git clone --depth 1 https://github.com/sublime-security/sublime-rules testdata/sublime-rules

      # The frontend accepts connections before the backend is draining the queue, so
      # readiness is a scan that succeeds, not a port that opens.
      - name: Wait for the backend
        env:
          LAZARET_STRELKA: localhost:57314
        run: |
          for i in $(seq 1 40); do
            if go test ./strelka/ -run TestLiveStrelka -count=1 >/dev/null 2>&1; then
              echo "ready after $((i * 3))s"; exit 0
            fi
            sleep 3
          done
          echo "::error::Strelka did not become ready"; exit 1

      - name: Live scan
        env:
          LAZARET_STRELKA: localhost:57314
          LAZARET_CORPUS: testdata/sublime-rules
        run: go test ./strelka/ -run Live -count=1 -v

      - name: Container logs
        if: failure()
        run: docker compose -f third_party/strelka/docker-compose.yml logs --tail 100
  # Everything the root module's ./... does not reach.
  #
  # The services are separate Go modules on purpose — it is what keeps an ONNX runtime
  # and a headless Chromium out of the library's dependency graph — and the cost is
  # that `go build ./...` from the root compiles none of them. Six of the eight
  # published images were code CI had never once compiled, so a pull request could
  # break the engine and stay green.
  services:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - telemetry
          - services/engine
          - services/ml
          - services/render
          - services/ingest
          - services/dashboard
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: true

      # The console is build output, not source, so a fresh checkout has an empty
      # web/dist holding only the marker that keeps //go:embed compiling. That is
      # enough to build the binary; it is not enough to know the front end still
      # type-checks, which is what this does.
      - uses: actions/setup-node@v7
        if: matrix.module == 'services/dashboard'
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: services/dashboard/web/package-lock.json
      - name: Build the console
        if: matrix.module == 'services/dashboard'
        working-directory: services/dashboard/web
        run: |
          npm ci
          npm run build      # vue-tsc runs first, so this type-checks as well

      # A known browser, rather than whatever the runner image happens to ship.
      #
      # The render tests skip when no browser is on PATH, so they were silently running
      # against Ubuntu's chromium, which is a snap. A snap's first start can take tens of
      # seconds, and that surfaced as two failures that reproduce nowhere else:
      # "websocket url timeout reached" waiting for the DevTools URL, and a render that
      # overran its 30s budget. Neither is a bug in the code under test.
      #
      # chrome-headless-shell is what the renderer already prefers (see binary() in
      # render.go), it is a plain binary with no snap confinement, and pinning the
      # version means a runner image change cannot quietly alter what these tests ran
      # against.
      - name: Install a browser for the render tests
        if: matrix.module == 'services/render'
        run: |
          set -eux
          version=$(curl -fsSL https://googlechromelabs.github.io/chrome-for-testing/last-known-good-versions.json \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["channels"]["Stable"]["version"])')
          curl -fsSL -o /tmp/chs.zip \
            "https://storage.googleapis.com/chrome-for-testing-public/$version/linux64/chrome-headless-shell-linux64.zip"
          unzip -q /tmp/chs.zip -d /tmp
          # The whole directory, not just the binary: it loads icudtl.dat and its .pak
          # files from beside itself, and a lone binary dies with "Invalid file
          # descriptor to ICU data received". A symlink onto PATH is fine, because
          # Chrome resolves its resources against the real path.
          sudo mv /tmp/chrome-headless-shell-linux64 /opt/chrome-headless-shell
          sudo ln -sf /opt/chrome-headless-shell/chrome-headless-shell /usr/local/bin/chrome-headless-shell
          chrome-headless-shell --version

      - name: Formatting
        working-directory: ${{ matrix.module }}
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt -w these:"; echo "$unformatted"; exit 1
          fi

      - working-directory: ${{ matrix.module }}
        run: go vet ./...
      - working-directory: ${{ matrix.module }}
        run: go build ./...
      # Not -race: the ml module links a C++ tokenizer and ONNX Runtime through cgo,
      # and the race detector has nothing useful to say about either.
      - working-directory: ${{ matrix.module }}
        run: go test ./...

      # Generated TypeScript is derived from the Go wire structs, so the two cannot
      # drift without somebody noticing here.
      - name: Generated types are current
        if: matrix.module == 'services/dashboard'
        working-directory: services/dashboard
        run: |
          go generate ./...
          git diff --exit-code web/src/api/types.gen.ts || {
            echo "::error::types.gen.ts is stale; run 'go generate ./...' in services/dashboard"
            exit 1
          }
